services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motoplan
      POSTGRES_PASSWORD: motoplan
      POSTGRES_DB: motoplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://motoplan:motoplan@postgres:5432/motoplan
      SECRET_KEY: your-secret-key-change-in-production
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  uploads: